<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon Clone | Sign in</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <a class="brand" href="/" aria-label="Amazon Clone home">amazon<span>clone</span></a>

      <section class="auth-card" aria-labelledby="login-title">
        <h1 id="login-title">Sign in</h1>

        <form id="login-form" novalidate>
          <label for="role">Sign in as</label>
          <select id="role" name="role">
            <option value="buyer">Buyer</option>
            <option value="seller">Seller</option>
          </select>

          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required autofocus />

          <div class="label-row">
            <label for="password">Password</label>
            <a href="#" aria-label="Password recovery is not available yet">Forgot password?</a>
          </div>
          <input id="password" name="password" type="password" autocomplete="current-password" required />

          <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
          <button id="submit-button" type="submit">Sign in</button>
        </form>

        <p class="terms">By continuing, you agree to this Amazon Clone's conditions of use and privacy notice.</p>
      </section>

      <section class="new-account" aria-label="Account registration">
        <p>New to Amazon Clone?</p>
        <a href="#" class="secondary-button">Create your account</a>
      </section>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
